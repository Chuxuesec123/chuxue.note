<header class="site-header" role="banner">

  <div class="wrapper">
    <a class="site-title" rel="author" href="{{ "/" | relative_url }}">{{ site.title | escape }}</a>

    {%- comment -%}
      顶栏刻意只留一个「目录」入口，正文页保持干净、可沉浸阅读。
      导航本身在 README（站点首页）里。首页自己就是目录，所以不显示这个按钮。
    {%- endcomment -%}
    {%- unless page.url == "/" -%}
    <a class="site-index-link" href="{{ "/" | relative_url }}">← 目录</a>
    {%- endunless -%}
  </div>
</header>
